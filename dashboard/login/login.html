<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Login — GameBridge</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="navbar">
    <a href="../../index.html" class="brand-logo">
        <img class="brand-logo" src="../../FinalLogo.png" alt="logo" />
        <span>GameBridge Site</span>
    </a>

    <a href="../../index.html" class="back-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Back to Home
    </a>
</header>

<main class="login-wrapper">
    <div class="background-glow"></div>

    <div class="login-card">
        <div class="login-header">
            <h1>Dashboard Access</h1>
            <p>Enter your server credentials to manage settings.</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="guildId">Discord Guild ID</label>
                <div class="input-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                        <line x1="12" y1="22.08" x2="12" y2="12"></line>
                    </svg>
                    <input type="text" id="guildId" class="form-control" placeholder="e.g. 12345678910" required autocomplete="off" />
                </div>
            </div>

            <div class="form-group">
                <label for="dashKey">Dashboard Key</label>
                <div class="input-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path>
                    </svg>
                    <input type="password" id="dashKey" class="form-control" placeholder="Enter your secret key" required autocomplete="off" />
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="spinner" id="spinner"></span>
                <span id="btnText">Connect to Server</span>
            </button>
        </form>

        <div id="statusMessage" class="status-message"></div>
    </div>
</main>

<script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const btn = document.getElementById('submitBtn');
        const spinner = document.getElementById('spinner');
        const btnText = document.getElementById('btnText');
        const statusBox = document.getElementById('statusMessage');

        const guildId = document.getElementById('guildId').value.trim();
        const dashKey = document.getElementById('dashKey').value.trim();

        if (!localStorage.getItem("gamebridge_cookie_consent")) {
            statusBox.textContent = `You must accept cookies first.`;
            statusBox.classList.add('error');
            return;
        }

        btn.disabled = true;
        spinner.style.display = 'inline-block';
        btnText.textContent = 'Authenticating...';

        statusBox.className = 'status-message';
        statusBox.textContent = '';

        try {
            const response = await fetch('https://138.201.21.30:10000/api/auth/verify', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    "guildId": guildId,
                    "key": dashKey
                })
            });

            if (response.ok) {
                statusBox.textContent = 'Successfully connected! Redirecting...';
                statusBox.classList.add('success');

                const data = await response.json();

                if (data.session) {
                    localStorage.setItem('session-token', data.session);
                }

                setTimeout(() => window.location.href = '../main/dashboard.html', 1500);
            } else if (response.status === 401) {
                btn.disabled = false;
                statusBox.textContent = `Incorrect login information.`;
                statusBox.classList.add('error');
            } else if (response.status === 429) {
                btn.disabled = false;
                statusBox.textContent = `Calm down! Too many login attempts, try again later.`;
                statusBox.classList.add('error');
            } else {
                btn.disabled = false;
                statusBox.textContent = `API Endpoint failure. ${response.status}`;
                statusBox.classList.add('error');
            }

        } catch (error) {
            btn.disabled = false;
            statusBox.textContent = 'Connection Error: Could not reach API. Is the server running?';
            statusBox.classList.add('error');
        } finally {
            spinner.style.display = 'none';
            btnText.textContent = 'Connect to Server';
        }
    });

    document.addEventListener('DOMContentLoaded',async function () {
        let sessionToken = localStorage.getItem('session-token');
        const statusBox = document.getElementById('statusMessage');
        const btn = document.getElementById('submitBtn');

        if (sessionToken) {
            btn.disabled = true;

            try {
                const response = await fetch('http://138.201.21.30:10000/api/auth/verify/session', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        "session": sessionToken,
                    })
                });

                if (response.ok) {
                    statusBox.textContent = 'Successfully connected! Redirecting...';
                    statusBox.classList.add('success');

                    setTimeout(() => window.location.href = '../main/dashboard.html', 1500);

                } else if (response.status === 401) {
                    statusBox.textContent = `Session expired.`;
                    statusBox.classList.add('error');
                    btn.disabled = false;
                } else if (response.status === 429) {
                    statusBox.textContent = `Calm down! Too many login attempts, try again later.`;
                    statusBox.classList.add('error');
                    btn.disabled = false;
                } else {
                    statusBox.textContent = `API Endpoint failure. ${response.status}`;
                    statusBox.classList.add('error');
                    btn.disabled = false;
                }
            } catch (error) {
                console.log(error)
                btn.disabled = false;
            }
        }
    });
</script>
<script src="required-banner.js"></script>
</body>
</html>
